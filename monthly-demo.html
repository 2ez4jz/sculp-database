<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SCULP · 月度分析 Demo</title><style>body{font:16px system-ui;background:#f6f4ef;color:#264439;max-width:750px;margin:5vh auto;padding:20px}main{background:white;padding:28px;border-radius:14px}h1{font-size:25px}label{display:inline-grid;gap:8px;margin:12px 12px 12px 0}input,select,button{font:inherit;padding:9px}button{background:#264439;color:white;border:0;border-radius:6px}p{line-height:1.7}table{border-collapse:collapse;width:100%;margin-top:16px}td,th{padding:12px;border-bottom:1px solid #ddd;text-align:left}</style><main><small>SCULP V1 · FICTIONAL DATA</small><h1>月度订单与金额分析</h1><p>仅使用虚构演示数据。金额为已完成订单的服务金额，不代表实际收款。</p><label>月份<input id="month" type="month" value="2026-09"></label><label>演示角色<select id="role"><option value="admin">管理员</option><option value="artist">员工</option></select></label><button id="run">查询</button><div id="result" role="status"></div><p><small>角色为界面模拟，并非真实登录认证。真实数据不在本页面提供。</small></p></main><script type="module">import{bookings}from'./src/data/demo.js';import{monthlyStats}from'./src/domain/monthly-stats.js';const box=document.querySelector('#result');function run(){if(new URLSearchParams(location.search).get('demo')!=='1'){box.textContent='仅限虚构演示，请使用 ?demo=1';return}try{const r=monthlyStats(bookings,document.querySelector('#month').value,{role:document.querySelector('#role').value});const money=new Intl.NumberFormat('en-CA',{style:'currency',currency:'CAD'}).format(r.amountCents/100);box.replaceChildren();const table=document.createElement('table');const fields=[['订单数（不含取消）',r.bookings],['已完成订单',r.completed],['已确认订单',r.confirmed],['咨询中',r.inquiries],['已取消',r.cancelled],['已完成订单金额（非实收）',money],['金额缺失',r.unpriced]];for(const [label,value]of fields){const tr=table.insertRow();tr.insertCell().textContent=label;tr.insertCell().textContent=value}box.append(table)}catch(error){box.textContent=error.message.includes('AUTH')?'无权限查看全局经营金额。':'请输入有效的月份。'}}document.querySelector('#run').onclick=run;run();</script></html>
