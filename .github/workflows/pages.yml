name: Deploy SCULP OS
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Read Pages publishing source
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/pages" --jq '{build_type, source}' || echo 'Pages source metadata unavailable'
      - name: Stage authenticated site
        run: python3 scripts/build-pages.py site-build --check-branch-config
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-build
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the live release and retired URLs
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: python3 scripts/verify-pages.py "$PAGES_URL" site-build "$GITHUB_SHA"
