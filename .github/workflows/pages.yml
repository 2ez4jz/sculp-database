name: Deploy SCULP OS
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Stage authenticated site
        run: python3 scripts/build-pages.py site-build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-build
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
