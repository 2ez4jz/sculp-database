name: Verify SCULP Demo
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Chinese fonts for visual checks
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - name: Verify calculations and AI handler contracts
        run: node --test scripts/domain.test.mjs scripts/backend.test.mjs scripts/context-memory.test.mjs scripts/account-admin.test.mjs scripts/chat.test.mjs scripts/intake-backend.test.mjs scripts/channels.test.mjs scripts/monthly-stats.test.mjs scripts/monthly-stats-edge.test.mjs scripts/monthly-insights.test.mjs scripts/monthly-chat.test.mjs
      - name: Prepare browser check
        run: npm install --no-save --package-lock=false playwright @electric-sql/pglite
      - name: Verify database transaction and permissions
        run: node --test scripts/memory-database.test.mjs scripts/auth-database.test.mjs scripts/chat-database.test.mjs scripts/intake-database.test.mjs
      - name: Verify interactions and responsive layouts
        run: |
          python3 -m http.server 4173 > /tmp/sculp-server.log 2>&1 &
          node scripts/monthly-browser.cjs
          node scripts/chat.cjs
          node scripts/auth.cjs
          node scripts/smoke.cjs
          node scripts/permissions.cjs
          node scripts/sculpy-lifecycle.cjs
          node scripts/context-memory.cjs
          node scripts/intake.cjs
          node scripts/cloud-intake.cjs
      - name: Save visual checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sculp-visual-checks
          path: qa-screens/
